<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">JSONOVA — JSON and XML readable in one tab</title>
  <desc id="desc">A dark blue JSONOVA title card with a simplified browser editor showing structured JSON and XML.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#132d49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fc9f4"/>
      <stop offset="1" stop-color="#64d6a5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="30" fill="url(#background)"/>
  <path d="M0 344C246 298 428 378 658 330C850 290 1024 284 1200 318V400H0Z" fill="#8fc9f4" opacity=".035"/>

  <g id="identity" transform="translate(72 58)">
    <g aria-hidden="true">
      <rect width="54" height="54" rx="15" fill="#f8fafc"/>
      <path d="M20 18l-8 9 8 9M34 18l8 9-8 9M29 15l-5 24" fill="none" stroke="#13243a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="72" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="800" letter-spacing="1">JSONOVA</text>
    <text x="0" y="126" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="800">JSON and XML.</text>
    <text x="0" y="191" fill="#8fc9f4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="800">Readable in one tab.</text>
    <text x="2" y="242" fill="#b7c6d8" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23">Format, search, fold and act—directly in Chrome.</text>

    <g transform="translate(0 276)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">
      <rect width="104" height="40" rx="12" fill="#8fc9f4" opacity=".13" stroke="#8fc9f4" stroke-opacity=".35"/>
      <text x="24" y="26" fill="#b8e2ff">JSON</text>
      <rect x="116" width="96" height="40" rx="12" fill="#64d6a5" opacity=".12" stroke="#64d6a5" stroke-opacity=".35"/>
      <text x="141" y="26" fill="#92e5be">XML</text>
      <text x="234" y="26" fill="#8497ad" font-weight="500">Chrome extension · static site</text>
    </g>
  </g>

  <g id="editor" aria-hidden="true">
    <rect x="684" y="62" width="466" height="300" rx="26" fill="#081423" stroke="#8fc9f4" stroke-opacity=".38"/>
    <rect x="684" y="62" width="466" height="58" rx="26" fill="#0d1b2d"/>
    <rect x="684" y="102" width="466" height="18" fill="#0d1b2d"/>
    <circle cx="716" cy="91" r="6" fill="#64d6a5"/>
    <text x="736" y="98" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="18" font-weight="800">JSONOVA</text>
    <rect x="870" y="76" width="66" height="31" rx="9" fill="#18334f"/>
    <text x="887" y="98" fill="#b8e2ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">JSON</text>
    <rect x="944" y="76" width="58" height="31" rx="9" fill="#102337"/>
    <text x="959" y="98" fill="#8ba0b7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">XML</text>
    <text x="1040" y="98" fill="#8497ad" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">FORMATTED</text>

    <g transform="translate(710 94)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18">
      <rect y="26" width="414" height="244" fill="#101d30"/>
      <path d="M42 26V270" stroke="#ffffff" stroke-opacity=".08"/>
      <g fill="#71849a" text-anchor="end">
        <text x="28" y="61">1</text><text x="28" y="91">2</text><text x="28" y="121">3</text><text x="28" y="151">4</text><text x="28" y="181">5</text><text x="28" y="211">6</text><text x="28" y="241">7</text>
      </g>
      <path d="M57 51l7 8 7-8" fill="none" stroke="#71849a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="81" y="61" fill="#d2dbe6">{</text>
      <text x="104" y="91" fill="#ef7d86">"format"</text><text x="201" y="91" fill="#d2dbe6">:</text><text x="218" y="91" fill="#91c66e">"json"</text><text x="282" y="91" fill="#d2dbe6">,</text>
      <text x="104" y="121" fill="#ef7d86">"readable"</text><text x="221" y="121" fill="#d2dbe6">:</text><text x="238" y="121" fill="#e6b760">true</text><text x="278" y="121" fill="#d2dbe6">,</text>
      <text x="104" y="151" fill="#ef7d86">"link"</text><text x="174" y="151" fill="#d2dbe6">:</text><text x="191" y="151" fill="#64d6a5" text-decoration="underline">"https://api.example"</text>
      <text x="104" y="181" fill="#ef7d86">"tools"</text><text x="185" y="181" fill="#d2dbe6">:</text><text x="202" y="181" fill="#d2dbe6">[</text>
      <text x="127" y="211" fill="#91c66e">"search"</text><text x="210" y="211" fill="#d2dbe6">,</text><text x="226" y="211" fill="#91c66e">"fold"</text><text x="288" y="211" fill="#d2dbe6">,</text>
      <text x="127" y="241" fill="#91c66e">"copy"</text><text x="190" y="241" fill="#d2dbe6">,</text><text x="206" y="241" fill="#91c66e">"download"</text>
      <text x="81" y="266" fill="#d2dbe6">}</text>
    </g>
  </g>

  <rect x="72" y="376" width="1056" height="3" rx="1.5" fill="url(#accent)" opacity=".78"/>
</svg>
