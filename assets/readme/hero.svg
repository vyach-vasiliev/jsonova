<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">JSONOVA — JSON and XML readable in one tab</title>
  <desc id="desc">A dark blue JSONOVA title card with a simplified browser editor showing structured JSON and XML.</desc>

