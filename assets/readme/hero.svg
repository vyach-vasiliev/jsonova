    <text x="72" y="36" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="30" font-weight="800" letter-spacing="1">JSONOVA</text>
    <text x="0" y="126" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="800">JSON and XML.</text>
    <text x="0" y="191" fill="#8fc9f4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="58" font-weight="800">Readable in one tab.</text>
